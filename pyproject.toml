[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covdiff"
version = "0.1.0"
description = "Diffusion models at the covariance-matrix level: reproducible baselines, structure audit and DDPM recovery for DOA estimation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Moiz Siddiq" }]
keywords = ["diffusion-models", "covariance-matrix", "DOA", "array-processing", "SPD", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["torch>=2.1", "pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
